apiVersion: v1
kind: Pod
metadata:
  name: rakesh-storage-pod
spec:
  containers:
  - name: storage-container
    image: alpine
    command: ["/bin/sh", "-c", "while true; do date >> /data/log.txt; sleep 5; done"]
    volumeMounts:
    - name: my-storage
      mountPath: /data
  volumes:
  - name: my-storage
    persistentVolumeClaim:
      claimName: rakesh-pvc
