apiVersion: v1
kind: Pod
metadata:
  name: tolerated-pod
  namespace: dev
spec:
  tolerations:
  - key: "tier"
    operator: "Equal"
    value: "dedicated"
    effect: "NoSchedule"
  containers:
  - name: nginx
    image: nginx:alpine
    resources:
      requests:
        memory: "16Mi"
        cpu: "10m"
