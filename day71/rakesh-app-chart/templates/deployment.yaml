apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakesh-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: rakesh-app
  template:
    metadata:
      labels:
        app: rakesh-app
    spec:
      containers:
      - name: nginx
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: {{ .Values.service.port }}
