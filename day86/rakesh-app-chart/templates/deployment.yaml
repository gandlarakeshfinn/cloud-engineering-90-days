apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  labels:
    app: rakesh-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: rakesh-app
  template:
    metadata:
      labels:
        app: rakesh-app
    spec:
      # DAY 86: Added Init Container
      initContainers:
        - name: init-setup
          image: busybox:1.28
          command: ['sh', '-c', "echo 'Init Container: Setup started at $(date)'; sleep 5; echo 'Init Container: Setup complete'"]
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: appName
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
