apiVersion: batch/v1
kind: Job
metadata:
  name: rakesh-post-install-job
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      containers:
      - name: post-install-container
        image: busybox
        command: ['sh', '-c', 'echo "DEPLOYMENT SUCCESSFUL - DATABASE MIGRATION SIMULATED" && sleep 5']
      restartPolicy: Never
