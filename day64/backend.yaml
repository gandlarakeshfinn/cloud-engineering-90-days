apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakesh-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rakesh-app
  template:
    metadata:
      labels:
        app: rakesh-app
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
---
apiVersion: v1
kind: Service
metadata:
  name: rakesh-svc
spec:
  selector:
    app: rakesh-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
