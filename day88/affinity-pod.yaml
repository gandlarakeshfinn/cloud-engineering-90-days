apiVersion: v1
kind: Pod
metadata:
  name: affinity-pod
  namespace: dev
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: disktype
            operator: In
            values:
            - ssd
  containers:
  - name: nginx
    image: nginx:alpine
    resources:
      requests:
        memory: "16Mi"
        cpu: "10m"
